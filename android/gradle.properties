# Daemon IPC is broken on this Linux VM (client connects to the daemon on
# 127.0.0.1 but dispatch fails; cross-process loopback itself works).
# Run Gradle in-process instead. Remove on a normal dev machine if the
# daemon works there.
org.gradle.daemon=false
# Lowered from the Flutter template default (-Xmx8G) for low-RAM build
# machines: this VM has ~8 GB total and the 8G daemon could not start.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
